; PlatformIO Configuration
; I2C OLED Monitor - ESP32 DevKit V1
; ====================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200
upload_speed = 460800

; Upload port (ESP32 terdeteksi)
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*

; Library Dependencies
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D PROFILE_CLAUDE_CODE

; ============================================
;  Profil lain (satu env per IDE / AI)
; ============================================
; Build/upload profil tertentu:
;   pio run -e antigravity -t upload
;
; Menambah IDE/AI baru:
;   1. bikin include/profiles/<nama>.h
;   2. tambah cabang #elif di include/config.h
;   3. tambah env di bawah ini

[env:antigravity]
extends = env:esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D PROFILE_ANTIGRAVITY

; Untuk modul OLED "dual color" (strip kuning 16px di atas, biru di bawah).
; Semua konten dipadatkan ke area kuning, jadi bagian biru tidak pernah menyala.
; Warna panel itu fisik dan tidak bisa diubah lewat software -- ini satu-satunya
; cara menampilkan "kuning saja" tanpa ganti modul.
[env:esp32dev-yellow]
extends = env:esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D PROFILE_CLAUDE_CODE
    -D YELLOW_ONLY=1
